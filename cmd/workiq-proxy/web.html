<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workiq-proxy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
#terminal { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="terminal"></div>
<script type="module">
import { Terminal } from 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm';
import { FitAddon } from 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm';
import { WebLinksAddon } from 'https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/+esm';

const container = document.getElementById('terminal');
const fitAddon = new FitAddon();
const term = new Terminal({
  cursorBlink: true,
  fontSize: 14,
  fontFamily: "'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace",
  theme: {
    background: '#0d1117',
    foreground: '#c9d1d9',
    cursor: '#58a6ff',
    selectionBackground: '#264f78',
    black: '#0d1117',
    red: '#ff7b72',
    green: '#7ee787',
    yellow: '#d29922',
    blue: '#58a6ff',
    magenta: '#bc8cff',
    cyan: '#39d353',
    white: '#c9d1d9',
    brightBlack: '#484f58',
    brightRed: '#ffa198',
    brightGreen: '#56d364',
    brightYellow: '#e3b341',
    brightBlue: '#79c0ff',
    brightMagenta: '#d2a8ff',
    brightCyan: '#56d364',
    brightWhite: '#f0f6fc',
  },
  allowTransparency: false,
  scrollback: 5000,
});

term.loadAddon(fitAddon);
term.loadAddon(new WebLinksAddon());
term.open(container);
requestAnimationFrame(() => fitAddon.fit());

// Update browser tab title when the REPL sends an OSC title sequence.
term.onTitleChange(title => { document.title = title; });

const wsUrl = `ws://${location.host}/v1/repl`;
let ws;
let hasConnected = false;

function showDisconnect() {
  term.writeln('');
  term.writeln('\x1b[1;31m  Connection lost.\x1b[0m');
  term.writeln('');
  term.writeln('  The workiq-proxy server is no longer running.');
  term.writeln('  Your session has ended — any in-progress work is safe.');
  term.writeln('');
  term.writeln('  To reconnect, restart the server in your terminal:');
  term.writeln('');
  term.writeln('    \x1b[1;33mworkiq-proxy web\x1b[0m');
  term.writeln('');
  term.writeln('  This page will reconnect automatically when the server is back.');
  term.writeln('');
  document.title = 'workiq-proxy (disconnected)';
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    if (hasConnected) {
      term.reset();
    }
    hasConnected = true;
    document.title = 'workiq-proxy';
    requestAnimationFrame(() => {
      fitAddon.fit();
      const dims = fitAddon.proposeDimensions();
      if (dims && dims.cols > 1) {
        ws.send(JSON.stringify({ cols: dims.cols, rows: dims.rows }));
      }
    });
  };

  ws.onmessage = (ev) => {
    const data = ev.data instanceof ArrayBuffer
      ? new Uint8Array(ev.data)
      : ev.data;
    term.write(data);
  };

  ws.onclose = () => {
    if (hasConnected) {
      showDisconnect();
    }
    // Retry with fixed 3s interval — server may come back.
    setTimeout(connect, 3000);
  };
}

term.onData(data => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(new TextEncoder().encode(data));
  }
});

new ResizeObserver(() => {
  fitAddon.fit();
  if (ws && ws.readyState === WebSocket.OPEN) {
    const dims = fitAddon.proposeDimensions();
    if (dims) ws.send(JSON.stringify({ cols: dims.cols, rows: dims.rows }));
  }
}).observe(container);

connect();
</script>
</body>
</html>
