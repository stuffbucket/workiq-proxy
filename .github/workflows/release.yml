name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install JS dev dependencies
        run: npm install --no-audit --no-fund

      - name: Scan for Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/workiq-proxy/

      - name: Build all platforms
        run: make all

      - name: Generate checksums
        run: sha256sum workiq-proxy-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5afe4a135340ade637041b3e55a # v2.5.0
        with:
          files: |
            workiq-proxy-darwin-x64
            workiq-proxy-darwin-arm64
            workiq-proxy-linux-x64
            workiq-proxy-linux-arm64
            workiq-proxy-win-x64.exe
            workiq-proxy-win-arm64.exe
            checksums.txt

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set npm package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          node -e "const p=require('./package.json'); p.version='${VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Copy README and LICENSE into npm dir
        run: cp README.md LICENSE npm/

      - name: Publish to npm with provenance
        run: cd npm && npm publish --access public --provenance
