name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare embed files
        run: make embed-files

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: ./cmd/workiq-proxy/

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JS dev dependencies
        run: npm install --no-audit --no-fund

      - name: Scan for Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/workiq-proxy/

      - name: Build all platforms
        run: make all

      - name: Generate checksums
        run: sha256sum workiq-proxy-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workiq-proxy-darwin-x64
            workiq-proxy-darwin-arm64
            workiq-proxy-linux-x64
            workiq-proxy-linux-arm64
            workiq-proxy-win-x64.exe
            workiq-proxy-win-arm64.exe
            checksums.txt

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set npm package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          node -e "const p=require('./package.json'); p.version='${VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Copy README and LICENSE into npm dir
        run: cp README.md LICENSE npm/

      - name: Publish to npm with provenance
        run: cd npm && npm publish --access public --provenance
